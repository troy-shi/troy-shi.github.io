<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>史张倬悦 Troy · 个人主页</title>
<meta name="description" content="史张倬悦（Troy）的个人主页 · Personal homepage of Troy">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 尽早设置语言和深浅色，避免页面闪一下
  (function () {
    var r = document.documentElement, l = null, th = null;
    try { l = localStorage.getItem('lang'); th = localStorage.getItem('theme'); } catch (e) {}
    if (l !== 'zh' && l !== 'en') l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    r.dataset.lang = l; r.lang = l === 'zh' ? 'zh-CN' : 'en';
    if (th) r.dataset.theme = th;
  })();
</script>
</head>
<body data-page="about" data-title='{"zh":"史张倬悦 Troy · 个人主页","en":"Troy (史张倬悦) · Personal Homepage"}'>
<div id="topbar"></div>
<div class="layout">
  <div id="sidebar"></div>
  <main>
    <section>
      <h2><span class="zh">关于我</span><span class="en">About Me</span></h2>
      <div class="placeholder"><span class="zh">待填写：个人介绍</span><span class="en">Coming soon: About me</span></div>
      <!-- ✏️ 在这里写个人介绍，中英文各一份，然后删掉上面的 placeholder：
      <p class="zh">你好！我是史张倬悦……</p>
      <p class="en">Hi! I'm Troy……</p>
      -->
    </section>

    <footer>
      © <span id="year"></span>
      <span class="zh">史张倬悦 Troy · 托管于 GitHub Pages</span><span class="en">Troy (史张倬悦) · Hosted on GitHub Pages</span>
    </footer>
  </main>
</div>
<script src="assets/site.js"></script>
</body>
</html>
