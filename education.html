<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学历 · 史张倬悦 Troy</title>
<meta name="description" content="史张倬悦（Troy）的个人主页 · Personal homepage of Troy">
<link rel="stylesheet" href="assets/style.css">
<script>
  // 尽早设置语言和深浅色，避免页面闪一下
  (function () {
    var r = document.documentElement, l = null, th = null;
    try { l = localStorage.getItem('lang'); th = localStorage.getItem('theme'); } catch (e) {}
    if (l !== 'zh' && l !== 'en') l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    r.dataset.lang = l; r.lang = l === 'zh' ? 'zh-CN' : 'en';
    if (th) r.dataset.theme = th;
  })();
</script>
</head>
<body data-page="education" data-title='{"zh":"学历 · 史张倬悦 Troy","en":"Education · Troy"}'>

<div class="layout">
  <div id="sidebar"></div>
  <main>
    <section>
      <h2><span class="zh">学历</span><span class="en">Education</span></h2>
      <!-- 内容来自 data/ 目录下的 json 文件，请用 Pages CMS 编辑 -->
      <div id="content"></div>
    </section>
    <footer id="footer"></footer>
  </main>
</div>
<script src="assets/site.js"></script>
</body>
</html>
