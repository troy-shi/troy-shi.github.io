<script>
  // 尽早设置语言和深浅色，避免页面闪一下
  (function () {
    var r = document.documentElement, l = null, th = null;
    try { l = localStorage.getItem('lang'); th = localStorage.getItem('theme'); } catch (e) {}
    if (l !== 'zh' && l !== 'en') l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
    r.dataset.lang = l; r.lang = l === 'zh' ? 'zh-CN' : 'en';
    if (th) r.dataset.theme = th;
  })();
</script>
</head>
